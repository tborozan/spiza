services:
  spiza:
    build:
      context: .
    image: ${SPIZA_IMAGE:-spiza-api:local}
    restart: unless-stopped
    ports:
      - "${SPIZA_HOST_PORT:-7492}:${SPIZA_PORT:-7492}"
    environment:
      SPIZA_PORT: ${SPIZA_PORT:-7492}
      SPIZA_DATABASE_PATH: ${SPIZA_DATABASE_PATH:-/data/spiza.db}
      SPIZA_API_KEY: ${SPIZA_API_KEY:-}
      SPIZA_REFRESH_ON_START: ${SPIZA_REFRESH_ON_START:-true}
      SPIZA_REFRESH_INTERVAL_MINUTES: ${SPIZA_REFRESH_INTERVAL_MINUTES:-1440}
      SPIZA_REFRESH_DAILY_AT: ${SPIZA_REFRESH_DAILY_AT:-00:05}
      SPIZA_REFRESH_RETRY_INTERVAL_MINUTES: ${SPIZA_REFRESH_RETRY_INTERVAL_MINUTES:-15}
      SPIZA_REFRESH_RETRY_MAX_INTERVAL_MINUTES: ${SPIZA_REFRESH_RETRY_MAX_INTERVAL_MINUTES:-240}
      SPIZA_TIME_ZONE_ID: ${SPIZA_TIME_ZONE_ID:-Europe/Zagreb}
      SPIZA_SOURCE_TIMEOUT_SECONDS: ${SPIZA_SOURCE_TIMEOUT_SECONDS:-30}
      SPIZA_SOURCE_RETRY_COUNT: ${SPIZA_SOURCE_RETRY_COUNT:-3}
      SPIZA_SOURCE_RETRY_DELAY_SECONDS: ${SPIZA_SOURCE_RETRY_DELAY_SECONDS:-2}
      SPIZA_SOURCE_REQUEST_DELAY_MS: ${SPIZA_SOURCE_REQUEST_DELAY_MS:-1100}
      SPIZA_SOURCE_REQUEST_BUDGET: ${SPIZA_SOURCE_REQUEST_BUDGET:-800}
      SPIZA_SOURCE_ARCHIVE_MAX_EXPANDED_BYTES: ${SPIZA_SOURCE_ARCHIVE_MAX_EXPANDED_BYTES:-1000000000}
      SPIZA_HISTORY_RETENTION_DAYS: ${SPIZA_HISTORY_RETENTION_DAYS:-30}
      SPIZA_BATCH_MAX: ${SPIZA_BATCH_MAX:-100}
      SPIZA_SEARCH_MAX_RESULTS: ${SPIZA_SEARCH_MAX_RESULTS:-50}
      SPIZA_EXPORT_MAX_ROWS: ${SPIZA_EXPORT_MAX_ROWS:-0}
      SPIZA_SQLITE_BUSY_TIMEOUT_MS: ${SPIZA_SQLITE_BUSY_TIMEOUT_MS:-5000}
      SPIZA_KONZUM_ENABLED: ${SPIZA_KONZUM_ENABLED:-true}
      SPIZA_LIDL_ENABLED: ${SPIZA_LIDL_ENABLED:-true}
      SPIZA_TOMMY_ENABLED: ${SPIZA_TOMMY_ENABLED:-true}
      SPIZA_SPAR_ENABLED: ${SPIZA_SPAR_ENABLED:-true}
      SPIZA_EUROSPIN_ENABLED: ${SPIZA_EUROSPIN_ENABLED:-true}
      SPIZA_PLODINE_ENABLED: ${SPIZA_PLODINE_ENABLED:-true}
      SPIZA_KAUFLAND_ENABLED: ${SPIZA_KAUFLAND_ENABLED:-true}
      SPIZA_DM_ENABLED: ${SPIZA_DM_ENABLED:-true}
      SPIZA_RIBOLA_ENABLED: ${SPIZA_RIBOLA_ENABLED:-true}
      SPIZA_METRO_ENABLED: ${SPIZA_METRO_ENABLED:-true}
      SPIZA_EFFECTIVE_PRICE_RULE: ${SPIZA_EFFECTIVE_PRICE_RULE:-promo-if-active}
      SPIZA_LOG_LEVEL: ${SPIZA_LOG_LEVEL:-Information}
    volumes:
      - spiza_data:/data

volumes:
  spiza_data:
